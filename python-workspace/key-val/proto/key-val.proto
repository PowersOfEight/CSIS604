syntax = "proto3";


// We'll start with a string key and a string value
// KISS simple
// Later, we can add more specific typing
message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  string message = 1;
}

service KeyValueStore {
  rpc PutKey (PutRequest) returns (PutResponse) {}
}
