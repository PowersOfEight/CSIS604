syntax = "proto3";


message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  string message = 1;
  bool success = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  EntryState state = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  string message = 1;
  bool success = 2;
}

message WatchRequest {
  string key = 1;
}

message WatchResponse {
  UpdateEvent update = 1;
}

// Represents the state of an Entry (key value pair)
// within the store
message EntryState {
  // Whether or not the entry exists (key in store)
  bool exists = 1;
  string key = 2;
  string value = 3;
}

// Represents an update of an Entry
// This is tracked by a change of state
message UpdateEvent {
  EntryState old = 1;
  EntryState new = 2;
}

service KeyValueStore {
  rpc PutKey (PutRequest) returns (PutResponse);
  rpc GetKey (GetRequest) returns (GetResponse); 
  rpc DeleteKey (DeleteRequest) returns (DeleteResponse); 
  rpc WatchKey (WatchRequest) returns (stream WatchResponse);
}
